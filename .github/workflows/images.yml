# Builds and pushes the engine container image, on demand only: Actions > Engine image > Run
# workflow, choosing the release tag (or branch) under "Use workflow from". At a release tag the
# image is tagged <tag>-<variant> (e.g. 0.1.0-cuda), on a branch <version>-<commit>-<variant>,
# plus <variant>; see `make image`. Images go to ghcr.io/<owner>/tinylm-engine. The base image
# (llama.cpp, PyTorch) is pulled when the registry has it for the current dependencies, otherwise
# built and pushed as well.
name: Engine image

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant
        type: choice
        options: [cpu, cuda, both]
        default: cpu

permissions:
  contents: read
  packages: write

jobs:
  variants:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          if [ "$VARIANT" = both ]; then echo 'list=["cpu","cuda"]'; else echo "list=[\"$VARIANT\"]"; fi >> "$GITHUB_OUTPUT"

  image:
    name: Engine image (${{ matrix.variant }})
    needs: variants
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.variants.outputs.list) }}
    steps:
      # The CUDA base is large: make room on the runner's disk first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/tinylm-engine" >> "$GITHUB_ENV"
      - name: Build and push the engine image
        run: make image-push VARIANT=${{ matrix.variant }} IMAGE="$IMAGE"
      - name: Push the base image
        run: make base-push VARIANT=${{ matrix.variant }} IMAGE="$IMAGE"
