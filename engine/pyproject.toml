[project]
name = "tinylm-engine"
version = "0.1.0"
description = "Local engine for tinylm-studio: ingestion, retrieval, training and inference."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psutil>=5.9",
    "torch>=2.4",
    "transformers>=4.50",
    "huggingface_hub>=0.25",
    "llama-cpp-python>=0.3.0",
    "jinja2>=3.1",
    "markitdown[pdf,docx,pptx,xlsx,xls]>=0.1.2",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "openai>=1.50", "anthropic>=0.40", "gguf>=0.10"]

[project.scripts]
tinylm-engine = "engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
